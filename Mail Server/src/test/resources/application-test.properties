spring.application.name=mail-server-test

# Tắt SSL trong test để không yêu cầu keystore.p12
server.ssl.enabled=false

# Cấu hình H2 Database chế độ tương thích MySQL cho kiểm thử tích hợp MockMvc
spring.datasource.url=jdbc:h2:mem:mailapp_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Khóa test hợp lệ (JWT >= 32 ký tự, AES Base64 đúng 32 bytes)
mailapp.jwt.secret=test-secret-key-minimum-32-bytes-for-unit-testing!
mailapp.jwt.expiration-ms=86400000
mailapp.aes.key=MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=

mailapp.auth.rate-limit.enabled=true
mailapp.auth.rate-limit.max-attempts=5
mailapp.auth.rate-limit.window-minutes=15
mailapp.auth.jwt.denylist-enabled=false

spring.threads.virtual.enabled=true
mailapp.admin.initial-password=Admin@123456
