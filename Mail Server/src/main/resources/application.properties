spring.application.name=mail-server

# Lắng nghe mọi interface mạng (0.0.0.0) phục vụ mạng LAN
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8443}
server.ssl.enabled=${SERVER_SSL_ENABLED:true}
server.ssl.key-store=${MAILAPP_KEYSTORE_PATH:classpath:keystore.p12}
server.ssl.key-store-password=${MAILAPP_KEYSTORE_PASS:${KEYSTORE_PASSWORD:}}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=mailapp

spring.datasource.url=jdbc:mysql://localhost:3306/mailapp_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${MAILAPP_DB_PASS:${DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Cấu hình Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

logging.level.root=INFO
# Driver exception text and bind diagnostics can contain rejected data values.
# The application reports sanitized exception types and business error codes.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.file.name=logs/mailapp.log

mailapp.jwt.secret=${MAILAPP_JWT_SECRET:${JWT_SECRET:}}
mailapp.jwt.expiration-ms=86400000
mailapp.aes.key=${MAILAPP_AES_KEY:${AES_KEY:}}

# Bật bộ lọc bắt buộc đổi mật khẩu khi must_change_password=true
mailapp.auth.must-change-password-enforce=true

# Virtual Threads Java 21 (IMAP / SMTP socket I/O là blocking I/O)
spring.threads.virtual.enabled=true

# Giới hạn multipart upload & thời gian chờ HTTP Tomcat (chống Slowloris / DoS tải lớn)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB
server.tomcat.connection-timeout=20s
server.tomcat.keep-alive-timeout=20s
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=65MB
server.max-http-request-header-size=16KB
# Cho phép StreamingResponseBody tải đính kèm lớn (25-100MB) không bị cắt ở ngưỡng mặc định 30s của Spring MVC
spring.mvc.async.request-timeout=180000

# Cấu hình kết nối Gmail dùng chung (M07 MailConnectionFactory)
mail.gmail.imap.host=imap.gmail.com
mail.gmail.imap.port=993
mail.gmail.smtp.host=smtp.gmail.com
mail.gmail.smtp.port=587
mail.gmail.connection-timeout-ms=10000
mail.gmail.timeout-ms=15000
mail.gmail.write-timeout-ms=30000
mail.gmail.retry.enabled=true
mail.gmail.retry.max-attempts=2
mail.gmail.retry.wait-duration-ms=300

# Cấu hình Rate Limiting đăng nhập chống brute-force (EP-A2)
mailapp.auth.rate-limit.enabled=true
mailapp.auth.rate-limit.max-attempts=5
mailapp.auth.rate-limit.window-minutes=15

# Khung danh sách JTI bị thu hồi (Denylist) - mặc định tắt
mailapp.auth.jwt.denylist-enabled=false

# Xử lý Forwarded Headers (Mặc định TẮT, chỉ tin tưởng getRemoteAddr trừ khi bật framework/native)
server.forward-headers-strategy=none

# Dev seed (tài khoản mẫu mật khẩu công khai) MẶC ĐỊNH TẮT; chỉ chạy khi profile=dev và MAILAPP_DEV_SEED=true
mailapp.dev.seed=${MAILAPP_DEV_SEED:false}

# Cấu hình SpringDoc OpenAPI (Mặc định tắt Swagger UI, chỉ bật ở profile dev)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

google.oauth2.client-id=${GOOGLE_CLIENT_ID:}
google.oauth2.client-secret=${GOOGLE_CLIENT_SECRET:}
google.oauth2.redirect-uri=${GOOGLE_REDIRECT_URI:https://localhost:8443/api/oauth2/callback}

# Cấu hình Spring Boot Actuator an toàn (chỉ mở health, info; health không lộ chi tiết)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Không lộ stack trace hay message nội bộ trong phản hồi lỗi
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Hiệu năng cao chống quá thời gian: Java 21 Virtual Threads (Project Loom) + IMAP Connection Pool
spring.threads.virtual.enabled=true
mail.gmail.pool.enabled=true
# Giữ connection sống lâu hơn cache danh sách thư mục (120s) để lần đọc lại sau khi cache
# hết hạn không phải bắt tay TCP+TLS+XOAUTH2 mới (đo thực tế: ~2-4s mỗi lần).
mail.gmail.pool.idle-seconds=180
mail.gmail.pool.max-per-account=2

# Private, persistent, per-instance directory. Keep it with the same database
# and AES key across process restarts; do not share it across running servers.
mail.audit.receipt-dir=${MAILAPP_AUDIT_RECEIPT_DIR:./data/mail-audit-receipts}
mail.audit.retry-base-ms=10000
