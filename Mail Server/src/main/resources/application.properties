spring.application.name=mail-server

server.port=8443
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${MAILAPP_KEYSTORE_PASS:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=mailapp

spring.datasource.url=jdbc:mysql://localhost:3306/mailapp_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=${MAILAPP_DB_USER:root}
spring.datasource.password=${MAILAPP_DB_PASS:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

logging.file.name=logs/mailapp.log

mailapp.jwt.secret=${MAILAPP_JWT_SECRET:dev-secret-key-change-in-production-min-32-bytes}
mailapp.jwt.expiration-ms=86400000
mailapp.aes.key=${MAILAPP_AES_KEY:}

google.oauth2.client-id=${GOOGLE_CLIENT_ID:}
google.oauth2.client-secret=${GOOGLE_CLIENT_SECRET:}
google.oauth2.redirect-uri=https://localhost:8443/api/oauth2/callback
