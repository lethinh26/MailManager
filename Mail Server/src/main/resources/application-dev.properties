# ==============================================================================
# Cấu hình môi trường phát triển (DEV PROFILE)
# ==============================================================================

# Bật Swagger UI và API Docs OpenAPI cho dev
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# DB mặc định kết nối MySQL chạy qua Docker Compose trên cổng 3307
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:${MYSQL_PORT:3307}/${MYSQL_DATABASE:mailapp_db}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:${MYSQL_USER:mailapp}}
spring.datasource.password=${MAILAPP_DB_PASS:${DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Cấu hình Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Mật khẩu khởi tạo ADMIN mặc định CHỈ tồn tại ở profile dev
mailapp.admin.initial-password=Admin@123456
