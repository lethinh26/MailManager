plugins {
    id 'java'
    id 'application'
}

group = 'com.mailapp'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.12'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.12'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    // Local mailbox fixture for the disposable HTTPS server integration suite.
    testImplementation 'com.icegreen:greenmail-junit5:2.1.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.mailapp.client.Main'
}

tasks.named('test') {
    useJUnitPlatform()
    // Swing/config regression tests must never touch the actual user's app settings.
    systemProperty 'mailclient.config.dir', new File(temporaryDir, 'client-config').absolutePath
}

tasks.named('run') {
    if (project.hasProperty('insecure') && project.property('insecure') == 'true') {
        jvmArgs '-Dmailclient.insecure=true'
    }
    if (System.getProperty('mailclient.insecure') != null) {
        systemProperty 'mailclient.insecure', System.getProperty('mailclient.insecure')
    }
}
